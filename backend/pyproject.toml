[project]
name = "yorapet-backend"
version = "0.1.0"
description = "YoraPet FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncmy==0.2.11",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "PyJWT==2.13.0",
    "pwdlib[argon2]==0.3.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.2.1",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["app"]
mypy_path = "."
plugins = ["pydantic.mypy"]

# Legacy modules: tighten incrementally (strict applies everywhere else).
[[tool.mypy.overrides]]
module = [
    "app.repositories.inventory_image_repository",
    "app.repositories.purchase_repository",
    "app.repositories.sale_repository",
    "app.services.purchase_overlay_service",
    "app.services.stock_fifo",
    "app.services.stock_summary_service",
    "app.services.tally_sync_service",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
