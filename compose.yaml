services:
  mysql:
    image: mysql:8.4
    container_name: yorapet2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yorapet_dev
      MYSQL_USER: yorapet
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - yorapet2_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  yorapet2_mysql_data:
