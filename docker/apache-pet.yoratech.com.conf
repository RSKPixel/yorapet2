# Apache reverse proxy: pet.yoratech.com → Yorapet Docker (frontend nginx on :8002)
#
# Enable modules (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite pet.yoratech.com
#   sudo systemctl reload apache2
#
# Place this file at:
#   /etc/apache2/sites-available/pet.yoratech.com.conf
#
# DNS: pet.yoratech.com A/AAAA → this Apache host
# Docker must be listening on 127.0.0.1:8002 on the same machine
# (or change ProxyPass targets to that host's LAN IP).

<VirtualHost *:80>
    ServerName pet.yoratech.com

    # Optional: redirect HTTP → HTTPS after certbot
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/

    ErrorLog  ${APACHE_LOG_DIR}/pet.yoratech.com-error.log
    CustomLog ${APACHE_LOG_DIR}/pet.yoratech.com-access.log combined
</VirtualHost>

# After: sudo certbot --apache -d pet.yoratech.com
# Certbot usually adds/updates the SSL vhost. Example if you manage it yourself:

# <VirtualHost *:443>
#     ServerName pet.yoratech.com
#
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/pet.yoratech.com/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/pet.yoratech.com/privkey.pem
#     Include /etc/letsencrypt/options-ssl-apache.conf
#
#     ProxyPreserveHost On
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Port "443"
#
#     ProxyPass        / http://127.0.0.1:8002/
#     ProxyPassReverse / http://127.0.0.1:8002/
#
#     ErrorLog  ${APACHE_LOG_DIR}/pet.yoratech.com-ssl-error.log
#     CustomLog ${APACHE_LOG_DIR}/pet.yoratech.com-ssl-access.log combined
# </VirtualHost>
