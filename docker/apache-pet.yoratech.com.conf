# Apache front door: pet.yoratech.com → Yorapet Docker on Mac Mini :8002
# Install on webserver:
#   sudo cp docker/apache-pet.yoratech.com.conf /etc/apache2/sites-available/yorapet.conf
#   (or merge into existing pet.yoratech.com / yorapet.conf)
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Requires: Docker stack healthy on 192.168.0.23:8002
#   cd ~/dev/yorapet2/docker && docker compose up -d
#
# For HTTPS (Certbot): SSL vhost must ProxyPass to the same Docker URL and set
#   RequestHeader set X-Forwarded-Proto "https"
# Then set AUTH_COOKIE_SECURE=true in docker/.env and recreate backend.

<VirtualHost *:80>
    ServerName pet.yoratech.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Entire app (SPA + /api + /uploads) via Docker nginx
    ProxyPass        / http://192.168.0.23:8002/
    ProxyPassReverse / http://192.168.0.23:8002/

    ErrorLog  ${APACHE_LOG_DIR}/pet.yoratech.com-error.log
    CustomLog ${APACHE_LOG_DIR}/pet.yoratech.com-access.log combined
</VirtualHost>

# Example SSL vhost (Certbot usually manages this; keep ProxyPass in sync):
#
# <VirtualHost *:443>
#     ServerName pet.yoratech.com
#
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/pet.yoratech.com/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/pet.yoratech.com/privkey.pem
#     Include /etc/letsencrypt/options-ssl-apache.conf
#
#     ProxyPreserveHost On
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Port "443"
#
#     ProxyPass        / http://192.168.0.23:8002/
#     ProxyPassReverse / http://192.168.0.23:8002/
#
#     ErrorLog  ${APACHE_LOG_DIR}/pet.yoratech.com-ssl-error.log
#     CustomLog ${APACHE_LOG_DIR}/pet.yoratech.com-ssl-access.log combined
# </VirtualHost>
